resolved_issues:
  - id: 'CONC-001'
    severity: medium
    category: reliability
    finding: 'LessonsService.completeLesson decidia a idempotência de XP a partir de um `findUnique` (leitura) FORA da transação (`const existing = ...; const alreadyCompleted = existing?.completed ?? false`) e, se `!alreadyCompleted`, executava `prisma.$transaction([upsert(completed:true), xpEvent.create])`. Sob dois POST /lessons/:id/complete concorrentes para o mesmo profileId+lessonId (ex.: double-tap / double-submit), ambos podiam ler `completed:false`, ambos entravam no ramo e ambos criavam um XpEvent → 20 XP para uma única lição (a linha LessonProgress fica única, mas XpEvent não tem constraint que o impeça). Era uma REGRESSÃO introduzida pela própria story 10.3: a mudança de schema (linha pode pré-existir por acesso via getLesson) obrigou a troca de `create` (que ANTES falhava com P2002 na unique constraint no segundo request concorrente, revertendo a transação inteira e evitando XP duplicado) por `upsert` (que absorvia o conflito com um update e deixava o segundo xpEvent.create passar). Corrompia o ledger XpEvent, fonte única de verdade de XP/nível/ranking (CLAUDE.md: "XP é derivado do ledger XpEvent"). Mesma classe do REL-001 da Story 9.3 (atomicidade upsert + XpEvent). A interação getLesson↔completeLesson já era SEGURA (o update do getLesson só toca lastAccessedAt); o problema era estritamente completeLesson↔completeLesson. O badge FIRST_LESSON não corrompia (ProfileBadge @@unique), mas awardBadgeIfEligible sob a mesma corrida podia lançar 500 no request perdedor.'
    resolution: 'A decisão de idempotência passou para DENTRO de um único `prisma.$transaction(async (tx) => {...})` interativo, via compare-and-swap no campo `completed` (lessons.service.ts, completeLesson): (1) `upsert` garante a existência da linha SEM tocar `completed` (no update só toca `lastAccessedAt`, evitando `update: {}` vazio e já serializando concorrentes sobre linha existente); (2) `const flipped = await tx.lessonProgress.updateMany({ where: { profileId, lessonId, completed: false }, data: { completed: true, completedAt: now, lastAccessedAt: now } })` — o WHERE `completed:false` é re-avaliado sob o write-lock da linha, serializando os completes concorrentes; (3) o XpEvent só é criado quando `flipped.count === 1`. Apenas a transação que efetivamente virou `false→true` credita XP; a concorrente vê count 0 e retorna xpAwarded:0. FIRST_LESSON também passou a ser decidido dentro da transação (count de completed:true === 1), concedido no máximo uma vez. O caso raro de corrida na CRIAÇÃO da linha (perfil nunca acessou a lição + dois completes simultâneos) é coberto por um catch de P2002 (única unique constraint em jogo é a de LessonProgress; XpEvent não tem nenhuma), que trata a transação perdedora como xpAwarded:0 sem 500. Reverificado: typecheck 7/7, build 4/4 e suíte completa (api 165/165 em 27 suites contra o TiDB real) verdes. Novo teste em gamification.test.ts ("idempotência sob concorrência real (CONC-001)"): linha pré-acessada + dois POST /complete via Promise.all → ambos 200, xpAwarded [0,10], exatamente 1 XpEvent no ledger, ≤1 badge FIRST_LESSON, xpTotal final = 10. O teste sequencial de idempotência pré-existente foi mantido intacto.'
top_issues:
  - id: 'MNT-001'
    severity: low
    category: code
    finding: 'seed.ts#completeLessonForProfile ainda usa o padrão antigo `findFirst({ where: { profileId, lessonId } })` + `if (existing) return;` como guarda de idempotência (linha 95). No contexto do seed isto é benigno: `seedAccounts` faz `prisma.user.deleteMany` (cascade → apaga LessonProgress) antes de semear, e o seed nunca cria linhas "apenas acessadas" (completed:false), então "linha existe" == "linha que este seed criou como completed:true". Não é o bug de "linha existe = concluída" de produção, mas é o único resquício textual do padrão antigo.'
    suggested_action: 'Não bloqueante. Se algum dia o seed passar a rodar em modo incremental sobre dados já acessados, trocar por `where: { profileId, lessonId, completed: true }` para alinhar semanticamente. Hoje é seguro.'
  - id: 'TEST-001'
    severity: low
    category: tests
    finding: 'Subtask 8.2 (rodar `pnpm --filter @ipp/database db:seed` contra o TiDB de DEMO real após a mudança de schema) foi deliberadamente NÃO executada pelo @dev para não mutar os dados de demonstração vigentes. Decisão correta, não um gap de implementação — a lógica do seed alterado é exercida de ponta a ponta por seed.integration.test.ts (@ipp/database, 15/15 verde), provando funcionalmente completeLessonForProfile com completed/completedAt/lastAccessedAt.'
    suggested_action: 'Ação humana pendente (não bloqueante para o gate): rodar o refresh do seed contra o TiDB de demo antes da próxima apresentação ao cliente, quando o responsável quiser regenerar a demo. A mudança de schema já está aplicada via `prisma db push`.'
