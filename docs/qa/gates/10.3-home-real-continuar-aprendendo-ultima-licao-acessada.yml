status_reason: 'Os 9 ACs foram atendidos e verificados em código + testes (typecheck 7/7, build 4/4, api 165/165 em 27 suites contra o TiDB real — 164 do gate original + 1 novo teste de concorrência; @ipp/database 15/15 e web 54/54). O único achado não-baixo do gate original (CONC-001, medium — janela de XP em dobro sob dois POST /complete concorrentes por causa da idempotência decidida fora da transação) foi CORRIGIDO pelo @dev nesta atualização, via compare-and-swap dentro de um único $transaction interativo (ver resolved_issues/CONC-001), e a correção está provada por um teste de concorrência real (dois completes em paralelo via Promise.all → exatamente 1 XpEvent no ledger). Restam apenas 2 achados low não-bloqueantes (MNT-001 resquício textual no seed; TEST-001 refresh manual do seed de demo). A mudança de significado de LessonProgress (existência da linha ≠ conclusão) segue corretamente propagada para completeLesson, catalog.getLessonsForTrack, parent.getCompletedLessons e seed; nenhum ponto de produção com o padrão "linha existe = concluída" restou.'
