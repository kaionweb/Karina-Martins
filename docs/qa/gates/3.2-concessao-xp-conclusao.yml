top_issues:
  - id: 'REL-001'
    severity: low
    finding: '`LessonsService.completeLesson` faz um check-then-act não atômico (`findFirst` seguido de `create` dentro de `$transaction`) para decidir se já foi concluída. A constraint `@@unique([profileId, lessonId])` no banco impede duplicação real de dados/XP mesmo sob concorrência verdadeira, mas uma segunda requisição verdadeiramente simultânea (não apenas um duplo-clique — o botão já fica `disabled` durante a chamada no cliente, cobrindo o caso comum) receberia um erro de constraint não tratado (500) em vez do 200 idempotente esperado.'
    suggested_action: 'Não bloqueante — cenário raro (exige requisições HTTP paralelas reais, não coberto pelo fluxo normal de UI). Se algum dia importar (ex: múltiplas abas do mesmo perfil), envolver o `create` em try/catch para o código de erro P2002 do Prisma e tratar como sucesso idempotente.'
