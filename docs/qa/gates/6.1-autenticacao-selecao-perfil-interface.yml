status_reason: 'Story fora do PRD original (Epic 6, solicitada diretamente pelo usuario apos o PRD/19 stories estarem completos). useProfileStore (Zustand) e useAuthGuard implementados e testados (4 cenarios); paginas /login, /register, /select-profile reaproveitam 100% de lib/auth/lib/api/profiles ja existentes (Story 1.2/1.4), sem alterar essas camadas. Todas as paginas protegidas existentes (home, catalog/[showId], lesson/[lessonId], dashboard, dashboard/transcripts/[profileId]) passaram a usar o guard; catalog (publica) ganhou so o AppHeader, sem guard, corretamente. Bug real encontrado e corrigido durante a implementacao: useAuthGuard incluia o objeto router (useRouter()) nas deps do useEffect, causando risco de loop de re-execucao caso o router nao seja uma referencia estavel entre renders - corrigido removendo router das deps (funcoes push/replace do Next.js sao estaveis), encontrado pelos proprios testes do hook. Bug de build corrigido: useSearchParams em /login exigia Suspense boundary - corrigido extraindo o conteudo para um componente interno envolvido em Suspense. Verificacao manual real no navegador (nao so testes automatizados) confirmou o fluxo completo: login com a conta de demo (familia.demo@kaionweb.com) -> selecao de perfil (lista Ana/Theo corretamente) -> /home com header completo -> /dashboard mostrando a jornada real de Theo (30 XP, 2 badges, 3 licoes, streak 3/3, dados reais do seed da Story 5.3) -> transcricoes (vazio, correto, ja que chat de IA ainda nao tem UI) -> logout -> confirmacao de que acesso direto a /home sem sessao redireciona para /login -> registro de conta nova com redirecionamento e mensagem de sucesso. Conta de teste criada durante a verificacao foi removida do banco ao final. pnpm typecheck (7/7), test (database 15/15, web 23/23 - 10 novos testes desta story, api 111/111) e build (4/4, todas as rotas novas corretamente Static/Dynamic) revalidados de forma independente.'
