resolved_issues:
  - id: 'REL-001'
    severity: medium
    finding: '`VideoWatchService.registerHeartbeat` não envolvia o upsert de `VideoWatch` (que fixa `completedAt`) e a criação do `XpEvent` em um único `prisma.$transaction`, diferente do padrão citado nas Dev Notes (`LessonsService.completeLesson`). Se a criação do `XpEvent` falhasse depois do upsert já ter persistido `completedAt`, nenhum heartbeat futuro tentaria de novo: `alreadyCompleted` travaria em `true` para sempre, perdendo XP e streak permanentemente.'
    resolution: 'Upsert de VideoWatch + checagem do teto diário + criação condicional do XpEvent agora rodam dentro de um único `prisma.$transaction(async (tx) => {...})` (transação interativa — necessária porque a criação do XpEvent depende de uma leitura condicional do teto diário, diferente do `$transaction([...])` em array usado por LessonsService, que não tem essa condicional). Qualquer falha em qualquer etapa reverte a transação inteira: o vídeo nunca fica marcado como concluído sem o XP correspondente ter sido decidido (concedido ou explicitamente capado) na mesma unidade atômica. Reverificado: `pnpm typecheck` (api), `pnpm build` (4/4) e suíte completa (146 testes API/23 suites) verdes, sem mudança de comportamento observável — só de atomicidade.'
top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'Subtask 7.2 (verificação manual no navegador — assistir vídeo até 80%, confirmar XP/streak com conta de demo) ficou desmarcada, como já documentado pelo @dev. Coberta indiretamente pelos testes de unidade/integração do heartbeat e por `streak.test.ts`.'
    suggested_action: 'Rodar a verificação manual (conta família.demo@kaionweb.com) antes da demo ao cliente, focando na UX do PlayerFacade/PauseOverlay reais dentro do YouTube embed — algo que teste automatizado não cobre.'
  - id: 'PERF-001'
    severity: low
    finding: '`Number(process.env.VIDEO_XP_DAILY_CAP) || DEFAULT_VIDEO_XP_DAILY_CAP` trata `VIDEO_XP_DAILY_CAP="0"` como "não definido" e cai no default 30, em vez de um teto zero explícito.'
    suggested_action: 'Trivial, não bloqueante — usar `Number.isFinite(...)` explícito só se algum dia for necessário um teto zero de propósito.'
