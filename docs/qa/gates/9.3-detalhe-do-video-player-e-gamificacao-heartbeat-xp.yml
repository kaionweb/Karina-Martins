  special_attention:
    - point: 'Front nunca decide conclusão sozinho'
      result: 'CONFIRMADO — front só envia positionSeconds (Math.floor(getCurrentTime())); watchedSeconds >= 0.8 * durationSeconds é calculado inteiramente em VideoWatchService, no backend.'
    - point: 'watchedSeconds nunca decresce'
      result: 'CONFIRMADO — Math.max(existing?.watchedSeconds ?? 0, positionSeconds); coberto por teste dedicado (heartbeat com posição menor após uma maior).'
    - point: 'Teto diário é soma de XP, não contagem de vídeos'
      result: 'CONFIRMADO — prisma.xpEvent.aggregate({_sum: {amount: true}}) sobre source VIDEO_COMPLETED do dia; vídeo capado ainda é marcado completedAt, sem novo XpEvent (xpCapped: true). Coberto por teste com cap=10.'
    - point: 'Streak conta automaticamente, sem mudança em GamificationService'
      result: 'CONFIRMADO — nenhuma alteração em gamification.service.ts; updateStreaks() já considera qualquer XpEvent do dia independente da source. streak.test.ts (pré-existente) segue verde.'
    - point: 'PlayerFacade não carrega iframe/script antes do clique'
      result: 'CONFIRMADO — estado activated controla a montagem do YT.Player; useEffect só roda quando activated=true; PlayerFacade.test.tsx assere ausência do script antes do clique e presença depois.'
    - point: 'Coexistência de VideosController (público) e VideoWatchController (guarded) no mesmo prefixo videos'
      result: 'CONFIRMADO — GET /videos/:id 200 sem token e POST /videos/:id/heartbeat 401 sem token, ambos confirmados pela suite de integração, sem conflito de rotas.'
    - point: 'Atomicidade upsert VideoWatch + XpEvent'
      result: 'CONFIRMADO (após fix) — upsert + checagem de teto + criação condicional do XpEvent agora rodam dentro de um único prisma.$transaction interativo. Ver resolved_issues/REL-001.'
