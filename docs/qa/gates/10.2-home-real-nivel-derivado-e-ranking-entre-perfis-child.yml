      note: 'getRanking reaproveita o padrão de agregação de getXpTotal (aggregate → groupBy para múltiplos perfis), findUniqueOrThrow para o perfil ativo (mesmo padrão de updateStreaks), Map profileId→total com default 0 para perfis sem XpEvent. deriveLevel é função pura centralizada em @ipp/shared (lib/level.ts) — sem duplicação front/back, com saneamento de entrada Math.max(0, Math.floor). Controller: handler getRanking idêntico em forma a getXpTotal/getBadges. IDS: CREATE de level.ts e rankingResponseSchema justificados (capacidade nova, sem artefato reutilizável); ADAPT pontual de home/page.tsx.'
    - check: 'Testes (cobertura adequada, todos passando)'
      verdict: PASS
      note: 'Executados nesta revisão (não apenas relatados): web 52 testes/18 arquivos (Vitest) — inclui level.test.ts (7 casos: 0/199/200/2450, negativo, fracionário, LEVEL_XP_STEP) e HomePage casos (d) "Nível 5" real sem faixa + "3º", (e) position null → "—". api 155 testes/25 suites (Jest, runInBand contra TiDB real) — inclui gamification-ranking.service.test.ts (ordenação desc, desempate por createdAt asc rodado 2x provando determinismo, ADULT → position null) e ranking.test.ts integração (401 sem token, 403 NO_ACTIVE_PROFILE, posições relativas + totalParticipants real). Caso obrigatório de empate determinístico presente e verde.'
    - check: 'Acceptance criteria (AC1-6)'
      verdict: PASS
      note: 'AC1: getRanking soma XpEvent.amount por profileId (groupBy), só CHILD, ordena desc com desempate createdAt asc, position 1-indexed, ADULT → null com totalParticipants = contagem CHILD. AC2: 401 sem token (JwtAuthGuard no controller) + 403 NO_ACTIVE_PROFILE (checagem manual req.user.profileId), mesmo padrão de xp/badges — coberto por integração. AC3: rankingResponseSchema (position int min1 nullable, totalParticipants int min0) + RankingResponse em gamification.schema.ts; lib/level.ts com LEVEL_XP_STEP=200, LevelInfo, deriveLevel; export em index.ts. AC4: home usa deriveLevel(xpTotal) → "Nível N" no cabeçalho sem faixa (L102) + ProgressBar do topo com progressPercent (L132). AC5: getRanking no mesmo Promise.all da gamificação; StatCard "Ranking" (L210) usa position real com fallback "—". AC6: pnpm build 4/4 completo verificado.'
    - check: 'Sem regressões'
      verdict: PASS
      note: 'pnpm typecheck 7/7, pnpm build 4/4, pnpm test (web 52/52 + api 155/155) — todos reexecutados de forma independente nesta revisão. Nenhuma suíte pré-existente quebrou. Home segue "use client"; getRanking entrou no Promise.all existente da 10.1 sem alterar o fluxo de loading/erro das demais chamadas. Import jornadaMock removido de home/page.tsx (ambos usos substituídos por dados reais); export jornadaMock mantido intacto em _mock/content.ts (fora de escopo).'
