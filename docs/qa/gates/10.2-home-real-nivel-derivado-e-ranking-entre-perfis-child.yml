      verdict: PASS
      note: 'getRanking: findUniqueOrThrow (perfil ativo) + findMany (ids CHILD, select id) + groupBy (soma por perfil) — sem N+1, agregação no banco. Sem paginação (decisão explícita: volume de demo). Sem estado em memória no servidor entre requests (adequado ao free tier, API pode dormir). Frontend: sem chamada extra para nível (deriveLevel local sobre XP já buscado); ranking entrou no Promise.all existente (nenhum round-trip serial novo). /home permanece rota estática no build.'
    - check: 'Segurança (OWASP básico)'
      verdict: PASS
      note: 'Endpoint novo protegido por @UseGuards(JwtAuthGuard) no controller + checagem manual req.user.profileId → ForbiddenException apiErrorBody NO_ACTIVE_PROFILE (idêntico a getXpTotal/getBadges) — 401/403 confirmados por integração. Ranking é global entre todos os CHILD do banco (decisão explícita da story), mas a resposta expõe SOMENTE { position, totalParticipants } — nunca nickname, id ou qualquer identidade de outros perfis (o service faz select id apenas para computar posição/contagem). Nenhum dado de perfil-criança de terceiros vaza. ANTHROPIC_API_KEY não tocada no web; sem secrets no cliente.'
    - check: 'Documentação'
      verdict: PASS
      note: 'Scope Note (8 itens, incl. 2 AUTO-DECISIONs: fórmula centralizada em @ipp/shared e desempate por createdAt asc), Dev Notes, Completion Notes e File List completos e coerentes com a implementação. Ausência de rótulo de faixa documentada e justificada (Artigo IV / Scope Note 5). Achado do dev sobre asserções relativas no banco compartilhado registrado.'
  special_attention:
    - point: 'Endpoint de ranking segue o padrão de segurança do módulo e não vaza dados de outras contas'
      result: 'CONFIRMADO — controller.ts:29-36 replica exatamente o padrão de getXpTotal/getBadges (guard de classe + checagem manual profileId + apiErrorBody NO_ACTIVE_PROFILE). service.getRanking retorna apenas { position, totalParticipants }; o findMany de perfis CHILD usa select { id: true } e os ids nunca saem no payload. Ranking global entre CHILD é decisão explícita da story e expõe só posição/contagem agregada.'
    - point: 'Determinismo do desempate (sort estável do V8 sobre lista pré-ordenada por createdAt asc)'
      result: 'CONFIRMADO — childProfiles vem com orderBy createdAt asc; childIds preserva essa ordem; [...childIds].sort(desc por XP) é estável (V8/Node >= 11) → entre XPs iguais a ordem createdAt asc é mantida. A ordem do groupBy é irrelevante (só alimenta um Map de lookup). Teste unit roda o caso de empate 2x e prova posições idênticas. Observação low (MNT-001): empate exato de createdAt ao milissegundo não tem critério secundário — cenário extremo, não bloqueante.'
    - point: 'deriveLevel não reintroduz rótulo de faixa (Artigo IV — No Invention)'
      result: 'CONFIRMADO — lib/level.ts retorna apenas { level, progressPercent }, sem faixa. home/page.tsx:102 renderiza "Nível {levelInfo.level}" sem sufixo e NÃO importa LevelTag. Grep por Intermediário/Iniciante/Avançado/Básico/LevelTag/faixa nos arquivos da story acha só comentários explicativos e a asserção negativa queryByText(/Intermediário/) === null no teste (d). LevelTag do @ipp/ui existe mas é usado apenas por telas de vídeo pré-existentes, não pela Home.'
    - point: 'Nenhuma mudança de schema Prisma nesta story'
      result: 'CONFIRMADO — git diff HEAD packages/database/prisma/schema.prisma vazio. Reaproveita Profile.type/createdAt e XpEvent.amount/profileId já existentes.'
    - point: 'Teste de integração do ranking roda contra o TiDB real (não mock)'
      result: 'CONFIRMADO — ranking.test.ts importa prisma de @ipp/database, registra usuário real, cria 3 perfis CHILD + XpEvents reais e exerce o app HTTP via supertest; sem vi.mock/jest.mock do banco. Suíte api rodou em 102s (runInBand) contra o banco real nesta revisão.'
    - point: 'Verificação manual no navegador (smoke test com conta demo)'
      result: 'NÃO EXECUTADA — sem ferramenta de browser/playwright disponível ao @architect neste ciclo. Registrada como gap explícito (TEST-001, low), mesma classe do gate da 10.1. Coberta indiretamente pelos testes de componente (d)/(e).'
