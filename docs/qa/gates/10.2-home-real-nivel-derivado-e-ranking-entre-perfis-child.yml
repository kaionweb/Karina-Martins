updated: '2026-08-09T00:00:00Z'
top_issues:
  - id: 'TEST-001'
    severity: low
    finding: 'Verificação manual no navegador (login familia.demo@kaionweb.com / perfil Theo, conferir "Nível N" no cabeçalho, barra de progresso e posição do ranking em /home coerentes com o XP real do banco) não foi executada — o @architect não tem ferramenta de browser/playwright disponível neste ciclo autônomo. Mesma classe do TEST-001 registrado no gate da Story 10.1 (que continua verdadeiro). Coberta indiretamente pelos testes de componente HomePage.test.tsx casos (d) "Nível 5" real sem rótulo + "3º" no ranking, e (e) position null → "—" sem quebrar.'
    suggested_action: 'Rodar o smoke test manual com a conta demo antes da apresentação ao cliente (dando tempo para o cold start da API no Render). Conferir que o "Nível 12 · Intermediário" fixo do design system foi de fato substituído pelo nível derivado real e que o ranking mostra a posição do perfil Theo.'
  - id: 'MNT-001'
    severity: low
    finding: 'Desempate do ranking usa apenas `orderBy: { createdAt: "asc" }` sem critério secundário (ex.: id). Em TiDB/MySQL o DateTime tem precisão de milissegundos; dois perfis CHILD criados no mesmo milissegundo teriam ordem não determinística entre si (a estabilidade do sort do V8 preserva a ordem da lista, mas a própria lista fica ambígua nesse empate exato de createdAt). Cenário extremo e improvável no volume de demo; a decisão de desempate por createdAt é explícita da story (Scope Note 7).'
    suggested_action: 'Não bloqueante. Em hardening futuro, adicionar `{ id: "asc" }` como orderBy secundário no findMany de childProfiles para tornar o desempate totalmente determinístico mesmo com createdAt idêntico ao milissegundo.'
waiver: { active: false }

