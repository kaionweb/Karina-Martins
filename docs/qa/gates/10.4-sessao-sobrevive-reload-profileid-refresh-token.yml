status_reason: 'As 9 ACs de código (AC1-9) estão implementadas e verificadas independentemente em código + testes, com regressão reexecutada do zero neste gate: typecheck limpo (api + web + packages/database, tsc --noEmit 0 erros), api 172/172 em 28 suites contra o TiDB real (inclui os novos casos de profileId no refresh, compatibilidade retroativa AC6 com token legado assinado manualmente, e Set-Cookie do refresh em /select) e web 58/58 em 18 arquivos (inclui os 3+1 casos novos de useAuthGuard da Subtask 6.1). Os 2 testes de REGRESSÃO SEC-002 (profiles.test.ts:128-144) continuam com o corpo intacto e verdes — a reemissão do refresh cookie no /select acontece SÓ no caminho de sucesso, depois da checagem SEC-002. Segurança do cookie inalterada (httpOnly/secure/sameSite:none/path:/auth), nenhuma decodificação de JWT introduzida no frontend (grep por jwt-decode/atob/parse manual: 0 ocorrências), separação de camadas preservada (lib/auth e token-store não importam Zustand). Dois itens NÃO-bloqueantes e sem defeito de código: (ENV-001, low) a build completa via turbo na raiz falha em @ipp/database#build por um lock transiente do Windows no query_engine-windows.dll.node durante prisma generate — reproduzido independentemente por mim, persiste entre execuções, ocorre em prisma generate (nunca chega ao tsc), e esta story NÃO altera o schema Prisma; api build (nest), web build (next, todas as 16 rotas geradas incl. as 4 que usam useAuthGuard) e packages/database tsc compilam limpos isoladamente, e o client gerado existente é válido (172 integrações verdes contra o TiDB real); (VER-001, low) a Subtask 7.1 (verificação manual em navegador real do bug de reload) está sendo executada em paralelo pelo @aiox-master no momento deste gate — pendente de confirmação externa, faz parte do DoD, mesma natureza do TEST-001 aceito como non-blocking no gate 10.3.'
reviewer: 'Aria (@architect) — papel de quality gate designado pela story (quality_gate: architect), com atenção extra por tocar segurança de sessão/cookies. Revalidação independente (não confiei nos relatos dos dois @dev): li o código real de produção e de todos os testes, reexecutei typecheck/test/build eu mesma e contei os números.'
reviewed_revision: 'branch:main (working tree, não commitado) sobre HEAD 16f3c4b — o gate não commita'
updated: '2026-08-09T17:20:00Z'
top_issues:
  - id: 'ENV-001'
    severity: low
    category: build
    finding: 'A build completa do monorepo via `pnpm build` (turbo) na raiz falha em `@ipp/database#build` com `EPERM: operation not permitted, rename ...query_engine-windows.dll.node` durante `prisma generate`. Reproduzi o erro de forma independente e ele persiste entre execuções: é um processo node em background (Windows) mantendo o DLL do query engine do Prisma bloqueado, impedindo o rename do arquivo .tmp sobre o DLL final. A falha ocorre em `prisma generate` — o `tsc` do pacote nunca chega a rodar. Esta story NÃO altera o schema Prisma (confirmado: nenhuma mudança em packages/database/prisma), então o client gerado existente é válido e as 172 integrações da api passam contra o TiDB real usando esse client. Portanto AC10 ("pnpm build completo do monorepo passa sem erros") não é demonstrável verde em UMA execução turbo neste ambiente Windows específico agora — mas não há defeito de código: api build (nest build), web build (next build — todas as 16 rotas geradas, incluindo /home, /dashboard, /catalog/[showId], /lesson/[lessonId], /dashboard/transcripts/[profileId], as 4 que consomem useAuthGuard) e packages/database `tsc --noEmit` compilam limpos isoladamente.'
    suggested_action: 'Non-blocking. Rerodar `pnpm build` na raiz depois que o processo node em background liberar o DLL (ou reiniciar o terminal/máquina), ou confiar na CI/Linux onde esse lock de arquivo do Windows não ocorre. Nenhuma mudança de código necessária. Mesma classe de nota de ambiente já observada nas Stories 10.1-10.3.'
  - id: 'VER-001'
    severity: low
    category: tests
    finding: 'Subtask 7.1 (verificação manual em navegador real: login → selecionar perfil → reload em /home e em ao menos mais uma rota requireProfile:true → usuário permanece na rota, sem cair em /select-profile) é etapa explícita do DoD desta story e não é executável no run autônomo (sem sessão de browser interativa). No momento deste gate ela está sendo executada EM PARALELO pelo @aiox-master. É a reprodução exata do bug que motivou a story, descoberto justamente fora de teste automatizado.'
    suggested_action: 'Non-blocking para o gate automatizado (mesma natureza do TEST-001 aceito no gate 10.3). Aguardar a confirmação do @aiox-master. Caso a verificação manual falhe, reabrir a story (InProgress) — mas os testes automatizados de useAuthGuard (casos a/b/c/c'') cobrem a lógica de repopulação da store a partir do hint, e o novo access token do /refresh também passa a carregar profileId (belt-and-suspenders).'
waiver: { active: false }

evidence:
  checks_performed:
    - check: 'Code review (padrões, legibilidade, manutenibilidade)'
      verdict: PASS
      note: 'Backend: jwt.util.ts ganha signRefreshToken/verifyRefreshToken espelhando exatamente signAccessToken/verifyAccessToken sobre JWT_REFRESH_SECRET, reaproveitando AccessTokenPayload; refresh-cookie.ts centraliza REFRESH_COOKIE_NAME/REFRESH_COOKIE_OPTIONS/REFRESH_TOKEN_EXPIRES_IN (antes espalhados em auth.controller e auth.service); auth.service.issueTokens/refresh usam as funções centralizadas, refreshSecret() privado removido; profiles.service.selectProfile e profiles.controller.select reemitem o refresh cookie só no caminho de sucesso. Frontend: token-store.ts ganha getProfileIdHint/setProfileIdHint no mesmo padrão módulo-level do access token; refreshAccessToken() popula/limpa o hint; useAuthGuard captura o hint em const local ANTES do await (robusto à limpeza concorrente do global sob React StrictMode) e repopula a store via listProfiles antes de decidir o redirect. Comentários explicam o porquê de cada decisão. Sem duplicação, sem hardcode.'
    - check: 'Testes (cobertura adequada, todos passando)'
      verdict: PASS
      note: 'api 172/172 em 28 suites (jest --runInBand contra o TiDB real): jwt.util.test.ts (round-trip com/sem profileId, throw para secret diferente e para expirado); auth.test.ts +2 casos (refresh reemitido por /select carrega profileId e /auth/refresh devolve {accessToken,profileId}; compatibilidade retroativa AC6 com token legado {sub} assinado manualmente via jwt.sign devolvendo {accessToken} sem profileId — teste REAL, não fachada); profiles.test.ts +1 caso (Set-Cookie de refresh decodificado por verifyRefreshToken contém {sub,profileId} corretos) e os 2 REGRESSÃO SEC-002 intactos e verdes. web 58/58 em 18 arquivos: useAuthGuard.test.ts com os 4 casos originais + 10.4a (hint+match → setActiveProfile, ready, sem redirect) + 10.4b (sem hint → redirect preservado, listProfiles não chamado) + 10.4c (hint sem match → redirect, hint consumido) + 10.4c'' (listProfiles rejeita → redirect sem exceção, hint consumido).'
    - check: 'Acceptance criteria (AC1-10)'
      verdict: PASS
      note: 'AC1 sign/verifyRefreshToken em jwt.util.ts sobre JWT_REFRESH_SECRET, mesma AccessTokenPayload — CONFIRMADO. AC2 refresh-cookie.ts com REFRESH_COOKIE_NAME/REFRESH_COOKIE_OPTIONS/REFRESH_TOKEN_EXPIRES_IN=7d — CONFIRMADO. AC3 issueTokens/refresh usam as funções centralizadas, refreshSecret() removido, comportamento inalterado para usuário sem perfil (login/refresh integração verdes) — CONFIRMADO. AC4 /profiles/:id/select reemite Set-Cookie refresh {sub,profileId} no caminho de sucesso, corpo continua {accessToken} — CONFIRMADO por integração (decodifica o cookie e assere sub+profileId). AC5 refresh() usa verifyRefreshToken e retorna {accessToken,profileId}; novo access token carrega o profileId do refresh — CONFIRMADO. AC6 token legado {sub} aceito, resposta {accessToken} sem profileId, sem 401/500 — CONFIRMADO por teste dedicado. AC7 SEC-002 sem regressão — CONFIRMADO (2 testes intactos verdes). AC8 token-store hint + refreshAccessToken popula/limpa, lib/auth sem Zustand — CONFIRMADO. AC9 useAuthGuard consome hint, repopula store antes do redirect, preserva comportamento sem hint, consome hint em todos os caminhos — CONFIRMADO por 4 testes. AC10 (build completo) — ver ENV-001: builds isolados verdes; turbo raiz bloqueado por lock de DLL do Windows não relacionado ao código.'
    - check: 'Sem regressões'
      verdict: PASS
      note: 'Os 2 testes REGRESSÃO SEC-002 (profiles.test.ts:128-144 — token CHILD não se autopromove a ADULT; token CHILD não troca para outro CHILD) têm corpo idêntico e passam. A checagem SEC-002 em selectProfile (linhas 59-66) roda ANTES de qualquer emissão de token (linhas 68-71); a reemissão do refresh cookie não a contorna. Suíte completa reexecutada do zero neste gate: api 172/172, web 58/58, typecheck api+web+database limpos. Nenhuma mudança de schema Prisma. Login/refresh/logout/google mantêm contrato (integrações da Story 1.2 verdes).'
    - check: 'Performance'
      verdict: PASS
      note: 'Custo adicional só no caminho de recuperação pós-reload: quando requireProfile e store vazia e há hint, um único listProfiles() é chamado e o hint é consumido (setProfileIdHint(null)) para não reprocessar em remounts subsequentes da mesma sessão. Sob React StrictMode (dev) o efeito roda 2x, gerando 2 listProfiles em dev — irrelevante em produção (StrictMode não duplica efeitos em prod). Backend: só 1 sign a mais por /select (refresh token). Adequado ao free tier que dorme (nenhum estado em memória no backend).'
    - check: 'Segurança (OWASP básico)'
      verdict: PASS
      note: 'Propriedades de segurança do cookie de refresh INALTERADAS: httpOnly:true, secure:true, sameSite:"none", path:"/auth" (refresh-cookie.ts:12-17) — confirmado idêntico ao que login já emitia e ao que os testes de integração asseram (HttpOnly + SameSite=None no Set-Cookie). Nenhuma decodificação de JWT introduzida no frontend: grep por jwt-decode|jwtDecode|atob|decodeJwt|split(".")|JSON.parse(atob em apps/web → 0 ocorrências; o frontend confia no profileId devolvido explicitamente por /auth/refresh (padrão pré-existente de lib/auth). profileId é o mesmo id não-sensível já presente no payload do access token; não é dado novo de perfil-criança. Compatibilidade retroativa evita deslogar à força usuários já logados no deploy (mitiga negação de serviço acidental). SEC-002 preservado. ANTHROPIC_API_KEY não tocada no web.'
    - check: 'Documentação'
      verdict: PASS
      note: 'Scope Note (9 itens, 2 AUTO-DECISIONs sobre onde viver o hint e quando consumi-lo, com rationale de separação de camadas), Dev Notes (causa raiz confirmada em código, API spec antes/depois, File Locations, Testing com casos obrigatórios), Debug Log (retomada após interrupção no Task 5, sintoma exato do mock desatualizado), Completion Notes e File List completos e coerentes com a implementação verificada. Nota de ambiente do EPERM registrada honestamente pelo @dev.'
  special_attention:
    - point: '#1 jwt.util.ts: signRefreshToken/verifyRefreshToken existem, mesmo formato, JWT_REFRESH_SECRET'
      result: 'CONFIRMADO — jwt.util.ts:18-24. signRefreshToken = jwt.sign(payload, JWT_REFRESH_SECRET, {expiresIn}); verifyRefreshToken = jwt.verify(token, JWT_REFRESH_SECRET) as AccessTokenPayload. Espelho exato de signAccessToken/verifyAccessToken (linhas 10-16), sobre a mesma interface AccessTokenPayload {sub, profileId?}. Round-trip provado por jwt.util.test.ts.'
    - point: '#2 refresh-cookie.ts: propriedades de segurança do cookie NÃO mudaram'
      result: 'CONFIRMADO — refresh-cookie.ts:10-19. REFRESH_COOKIE_NAME="refresh_token"; REFRESH_COOKIE_OPTIONS={httpOnly:true, secure:true, sameSite:"none", path:"/auth"}; REFRESH_TOKEN_EXPIRES_IN="7d". Nenhuma das 4 propriedades de segurança foi alterada em relação ao que existia antes (auth.test.ts assere HttpOnly + SameSite=None no cookie de login e de /select, ambos usando a mesma constante).'
    - point: '#3 auth.controller.ts: 4 referências ao cookie usam a constante importada, incl. a de refresh que só LÊ'
      result: 'CONFIRMADO — auth.controller.ts importa REFRESH_COOKIE_NAME/REFRESH_COOKIE_OPTIONS de refresh-cookie.ts (linha 7). login (26 res.cookie), refresh (33 req.cookies[REFRESH_COOKIE_NAME] — só lê, não seta, o achado do @po), googleAuthCallback (55 res.cookie), logout (40 res.clearCookie(REFRESH_COOKIE_NAME,...)). Nenhuma constante local remanescente. profiles.controller também importa e usa (linha 6, 34).'
    - point: '#4 auth.service.refresh(): verifyRefreshToken, retorna {accessToken, profileId}, undefined para legado; teste de compat retroativa é real'
      result: 'CONFIRMADO — auth.service.ts:82-96 usa verifyRefreshToken e retorna {accessToken: signAccessToken({sub,profileId}), profileId: payload.profileId} (undefined omitido pelo JSON.stringify). O teste de compatibilidade (auth.test.ts:169-182) NÃO é fachada: assina manualmente jwt.sign({sub: userId}, JWT_REFRESH_SECRET, {expiresIn:"7d"}) — payload legado sem passar por selectProfile — envia como cookie e assere 200 {accessToken} com profileId undefined. Testa de verdade a aceitação do token legado.'
    - point: '#5 selectProfile/select: reemissão só no sucesso, DEPOIS de SEC-002; 2 testes SEC-002 intactos'
      result: 'CONFIRMADO — profiles.service.ts: checagem SEC-002 (59-66, CHILD ativo não troca de perfil) roda ANTES do return que emite access+refresh (68-71). profiles.controller.ts:33-35 seta o cookie após o service retornar (só chega aqui no sucesso; exceções SEC-002/404 abortam antes). Os 2 testes REGRESSÃO SEC-002 (profiles.test.ts:128-144) têm corpo idêntico e passam verdes.'
    - point: '#6 useAuthGuard: hint sempre consumido (setProfileIdHint(null)); lib/auth/token-store sem Zustand'
      result: 'CONFIRMADO — useAuthGuard.ts: hint consumido no caminho de match (linha 40) e no caminho de não-match/erro (linha 51); nenhum caminho com hint deixa de limpá-lo. Detalhe robusto: o hint é lido em const local ANTES do await listProfiles(), então a limpeza concorrente do global sob React StrictMode (reactStrictMode:true) não impede a invocação viva de repopular a store. token-store.ts não importa nada; lib/auth/index.ts importa só de token-store — nenhum importa useProfileStore/Zustand. Barreira de camadas preservada.'
    - point: '#7 Segurança: nenhuma decodificação de JWT introduzida no frontend'
      result: 'CONFIRMADO — grep em apps/web por jwt-decode|jwtDecode|atob|decodeJwt|split de JWT|JSON.parse(atob: 0 ocorrências. O profileId chega ao front exclusivamente via corpo de /auth/refresh (data.profileId), consistente com o padrão do projeto (API sempre devolve os dados explicitamente, cliente nunca decodifica token).'
    - point: 'Revalidação independente da regressão (não confiar nos relatos dos dois @dev)'
