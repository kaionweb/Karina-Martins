      result: 'ENV-001 (low, non-blocking) — `pnpm build` na raiz falha em @ipp/database#build por EPERM no rename de query_engine-windows.dll.node durante prisma generate; reproduzi independentemente, persiste entre execuções (processo node em background segura o DLL no Windows). Ocorre em prisma generate, nunca chega ao tsc. Story não altera schema Prisma → client gerado existente é válido (172 integrações verdes). Builds isolados de api, web e o tsc de database compilam limpos. Sem defeito de código.'
